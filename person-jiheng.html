<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>季衡 · 长安纪事</title><link rel="stylesheet" href="person.css"></head><body><main class="person-page"><div class="person-bg"></div><div class="person-inner"><nav class="person-nav"><a href="place-qujiang.html">← 曲江</a><span>人物卷 · 01</span></nav><article class="person-sheet"><div class="seal">长安<br>纪事</div><span class="chapter">曲江 · 临水楼</span><h1>季衡</h1><div class="role">夜游文士</div><p class="lead">季衡不喜欢宴席最热闹时，总在散席后走到水边，看灯影被水波打碎。</p><div class="story-body"><p>他写诗却不急着成篇，只记掌灯女子、收摊老人、桥边少年。他认为长安最动人的地方，是宏大城市与微小人生同时存在。</p><p>夜色继续向城南延伸。季衡没有成为史书里最响亮的名字，却在自己的位置上留下了一点痕迹：一盏灯、一封信、一笔账、一次让路，或一顿留给晚归人的热饭。把古卷翻得慢一些，城市真正的温度便会从这些细节里浮现出来。</p></div><div class="quote">“长安并不只在宫阙与大道之间，也在一个人愿意替另一个人留灯的那一刻。”</div><div class="person-footer"><a href="place-qujiang.html">返回曲江人物索引</a><a href="person-xieniang.html">下一位人物 →</a></div></article><div class="back-place"><a href="changan-jishi.html">回到长安纪事总卷</a></div></div></main></body></html>
