<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裴慎 · 长安纪事</title><link rel="stylesheet" href="person.css"></head><body><main class="person-page"><div class="person-bg"></div><div class="person-inner"><nav class="person-nav"><a href="place-dongshi.html">← 东市</a><span>人物卷 · 02</span></nav><article class="person-sheet"><div class="seal">长安<br>纪事</div><span class="chapter">东市 · 安远客栈</span><h1>裴慎</h1><div class="role">行脚账房</div><p class="lead">裴慎护送账册多年，随身只有薄账与旧笔。他记钱，也记人情：谁借过马，谁分过干粮。</p><div class="story-body"><p>一次商队夜路遇险，他靠账册旧人名找到援手。从此账页边写的不只是数字，而是一座城市互相照应的暗线。</p><p>夜色继续向城南延伸。裴慎没有成为史书里最响亮的名字，却在自己的位置上留下了一点痕迹：一盏灯、一封信、一笔账、一次让路，或一顿留给晚归人的热饭。把古卷翻得慢一些，城市真正的温度便会从这些细节里浮现出来。</p></div><div class="quote">“长安并不只在宫阙与大道之间，也在一个人愿意替另一个人留灯的那一刻。”</div><div class="person-footer"><a href="place-dongshi.html">返回东市人物索引</a><a href="person-shenyan.html">下一位人物 →</a></div></article><div class="back-place"><a href="changan-jishi.html">回到长安纪事总卷</a></div></div></main></body></html>
