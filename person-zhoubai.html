<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周伯 · 长安纪事</title><link rel="stylesheet" href="person.css"></head><body><main class="person-page"><div class="person-bg"></div><div class="person-inner"><nav class="person-nav"><a href="place-xingdao.html">← 兴道坊</a><span>人物卷 · 01</span></nav><article class="person-sheet"><div class="seal">长安<br>纪事</div><span class="chapter">兴道坊 · 桂香食肆</span><h1>周伯</h1><div class="role">食肆主人</div><p class="lead">周伯的小店总有熟客。他不问客人从哪来，只问要不要添一碗汤。</p><div class="story-body"><p>他见过少年进城，也见过多年后他们带孩子回来。他守着的不是一家食肆，而是一小段可以重复经过的人生。</p><p>夜色继续向城南延伸。周伯没有成为史书里最响亮的名字，却在自己的位置上留下了一点痕迹：一盏灯、一封信、一笔账、一次让路，或一顿留给晚归人的热饭。把古卷翻得慢一些，城市真正的温度便会从这些细节里浮现出来。</p></div><div class="quote">“长安并不只在宫阙与大道之间，也在一个人愿意替另一个人留灯的那一刻。”</div><div class="person-footer"><a href="place-xingdao.html">返回兴道坊人物索引</a><a href="person-shenlang.html">下一位人物 →</a></div></article><div class="back-place"><a href="changan-jishi.html">回到长安纪事总卷</a></div></div></main></body></html>
