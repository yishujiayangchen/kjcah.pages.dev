<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>林先生 · 长安纪事</title><link rel="stylesheet" href="person.css"></head><body><main class="person-page"><div class="person-bg"></div><div class="person-inner"><nav class="person-nav"><a href="place-xingdao.html">← 兴道坊</a><span>人物卷 · 03</span></nav><article class="person-sheet"><div class="seal">长安<br>纪事</div><span class="chapter">兴道坊 · 纸墨斋</span><h1>林先生</h1><div class="role">装裱匠人</div><p class="lead">林先生一生与纸打交道，修过经卷，也装裱过年轻人的第一幅字。</p><div class="story-body"><p>他最喜欢修旧纸，因为裂痕不能消失，只能被更细致地托住。他说人也一样：保存不是让时间停止，而是让风雨后的东西仍能被打开。</p><p>夜色继续向城南延伸。林先生没有成为史书里最响亮的名字，却在自己的位置上留下了一点痕迹：一盏灯、一封信、一笔账、一次让路，或一顿留给晚归人的热饭。把古卷翻得慢一些，城市真正的温度便会从这些细节里浮现出来。</p></div><div class="quote">“长安并不只在宫阙与大道之间，也在一个人愿意替另一个人留灯的那一刻。”</div><div class="person-footer"><a href="place-xingdao.html">返回兴道坊人物索引</a><a href="person-zhoubai.html">下一位人物 →</a></div></article><div class="back-place"><a href="changan-jishi.html">回到长安纪事总卷</a></div></div></main></body></html>
