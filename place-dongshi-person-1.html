<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>苏合 · 长安纪事</title><link rel="stylesheet" href="person.css"></head><body><main class="person-page"><div class="person-bg"></div><div class="person-inner"><nav class="person-nav"><a href="place-dongshi.html">← 东市</a><span>人物卷 · 01</span></nav><article class="person-sheet"><div class="seal">长安<br>纪事</div><span class="chapter">东市 · 胡姬酒肆</span><h1>苏合</h1><div class="role">西域译者</div><p class="lead">苏合随商队来到长安，懂几种语言，却发现最难翻译的是人的情绪。</p><div class="story-body"><p>一次商谈因一句话僵持，他没有急着翻译，而让双方先喝茶。气氛缓和后，谈判继续。他第一次觉得语言不是换词，而是在陌生人之间搭桥。</p><p>夜色继续向城南延伸。苏合没有成为史书里最响亮的名字，却在自己的位置上留下了一点痕迹：一盏灯、一封信、一笔账、一次让路，或一顿留给晚归人的热饭。把古卷翻得慢一些，城市真正的温度便会从这些细节里浮现出来。</p></div><div class="quote">“长安并不只在宫阙与大道之间，也在一个人愿意替另一个人留灯的那一刻。”</div><div class="person-footer"><a href="place-dongshi.html">返回东市人物索引</a><a href="place-dongshi-person-2.html">下一位人物 →</a></div></article><div class="back-place"><a href="changan-jishi.html">回到长安纪事总卷</a></div></div></main></body></html>
