<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沈砚 · 长安纪事</title><link rel="stylesheet" href="person.css"></head><body><main class="person-page"><div class="person-bg"></div><div class="person-inner"><nav class="person-nav"><a href="place-dongshi.html">← 东市</a><span>人物卷 · 03</span></nav><article class="person-sheet"><div class="seal">长安<br>纪事</div><span class="chapter">东市 · 万宝行</span><h1>沈砚</h1><div class="role">年轻掌柜</div><p class="lead">沈砚接手万宝行后，先整理旧账。他发现每件货物都有漫长旅程：绢从江南来，玉从更远处来。</p><div class="story-body"><p>他渐渐明白，东市珍贵的不只是货，而是货物背后的道路。打烊时，他总给门口留一盏灯，让晚归伙计知道有人等。</p><p>夜色继续向城南延伸。沈砚没有成为史书里最响亮的名字，却在自己的位置上留下了一点痕迹：一盏灯、一封信、一笔账、一次让路，或一顿留给晚归人的热饭。把古卷翻得慢一些，城市真正的温度便会从这些细节里浮现出来。</p></div><div class="quote">“长安并不只在宫阙与大道之间，也在一个人愿意替另一个人留灯的那一刻。”</div><div class="person-footer"><a href="place-dongshi.html">返回东市人物索引</a><a href="person-suhe.html">下一位人物 →</a></div></article><div class="back-place"><a href="changan-jishi.html">回到长安纪事总卷</a></div></div></main></body></html>
