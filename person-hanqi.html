<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>韩七 · 长安纪事</title><link rel="stylesheet" href="person.css"></head><body><main class="person-page"><div class="person-bg"></div><div class="person-inner"><nav class="person-nav"><a href="place-xishi.html">← 西市</a><span>人物卷 · 02</span></nav><article class="person-sheet"><div class="seal">长安<br>纪事</div><span class="chapter">西市 · 长亭客舍</span><h1>韩七</h1><div class="role">老行脚</div><p class="lead">韩七年轻时赶车，后来替人认路。他知道哪条街快、哪座桥雨后滑，也知道城门何时拥挤。</p><div class="story-body"><p>他曾带迷路少年穿夜色。少年问为何绕远，他说：“我年轻时也有人给我让过一盏灯。”少年记了一辈子。</p><p>夜色继续向城南延伸。韩七没有成为史书里最响亮的名字，却在自己的位置上留下了一点痕迹：一盏灯、一封信、一笔账、一次让路，或一顿留给晚归人的热饭。把古卷翻得慢一些，城市真正的温度便会从这些细节里浮现出来。</p></div><div class="quote">“长安并不只在宫阙与大道之间，也在一个人愿意替另一个人留灯的那一刻。”</div><div class="person-footer"><a href="place-xishi.html">返回西市人物索引</a><a href="person-cuiniangzi.html">下一位人物 →</a></div></article><div class="back-place"><a href="changan-jishi.html">回到长安纪事总卷</a></div></div></main></body></html>
